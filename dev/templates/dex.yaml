apiVersion: v1
kind: Secret
metadata:
  name: dex-dev-client
type: Opaque
stringData:
  DEX_CLIENT_ID: passmower
  DEX_CLIENT_SECRET: local-development-only
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-dev
data:
  config.yaml: |
    issuer: {{ required "dexIssuer is required" .Values.dexIssuer }}
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: passmower
        name: Passmower local development
        secret: local-development-only
        redirectURIs:
          - https://{{ required "passmowerHost is required" .Values.passmowerHost }}/interaction/callback/dex
    enablePasswordDB: false
    connectors:
      - type: mockCallback
        id: mock
        name: Local development user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex-dev
  template:
    metadata:
      labels:
        app: dex-dev
      annotations:
        checksum/config: {{ printf "%s:%s" .Values.passmowerHost .Values.dexIssuer | sha256sum }}
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: [dex, serve, /etc/dex/config.yaml]
          ports:
            - containerPort: 5556
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dex-dev
---
apiVersion: v1
kind: Service
metadata:
  name: dex-dev
spec:
  type: NodePort
  selector:
    app: dex-dev
  ports:
    - port: 5556
      targetPort: 5556
      nodePort: 30556
