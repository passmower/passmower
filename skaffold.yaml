apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: passmower

build:
  platforms: [linux/amd64]
  tagPolicy:
    inputDigest: {}
  local:
    push: true
    useDockerCLI: true
    useBuildkit: true
  artifacts:
    - image: passmower
      docker:
        target: prod
        network: host

# Helm keeps the install-only signing-key initializer and existing release state.
# The selected kubeconfig context and Skaffold namespace choose the destination.
deploy:
  helm:
    releases:
      - name: passmower
        chartPath: charts/passmower
        skipTests: true
        valuesFiles:
          - '{{default "charts/passmower/values.yaml" .PASSMOWER_VALUES_FILE}}'
        setValueTemplates:
          image.repository: '{{.IMAGE_REPO_passmower}}'
          image.tag: '{{.IMAGE_TAG_passmower}}'
          image.digest: '{{default "" .IMAGE_DIGEST_passmower}}'
