# Used by scripts/dev-minikube.sh. No external credentials are required.
passmower:
  usernameSource: generated
  githubEnabled: false
  githubClientSecretRef: ""
  outboundEmailEnabled: false
  emailCredentialsSecretRef: ""
  webauthnEnabled: false
  namespaceSelector: passmower-dev
  oidcAllowInsecureUpstream: true
  oidcProviders:
    dex:
      displayName: Dex
      clientSecretRef: dex-dev-client
redis:
  internal:
    enabled: true
ingress:
  className: nginx
image:
  pullPolicy: Never

# The dev image builds the frontend and styles into /app at runtime as root,
# so it cannot run under the restricted defaults. Each key is set explicitly:
# Helm merges maps, so an empty `{}` here would keep the chart's defaults.
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
securityContext:
  readOnlyRootFilesystem: false
