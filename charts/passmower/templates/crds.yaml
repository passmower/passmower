---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scimconnections.codemowers.cloud
spec:
  group: codemowers.cloud
  names:
    plural: scimconnections
    singular: scimconnection
    kind: SCIMConnection
    listKind: SCIMConnectionList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - group
                - tokenHashes
              properties:
                group:
                  type: object
                  required:
                    - prefix
                    - name
                  properties:
                    prefix:
                      type: string
                      minLength: 1
                    name:
                      type: string
                      minLength: 1
                grantMode:
                  type: string
                  enum:
                    - all-users
                    - mapped-groups
                  default: all-users
                tokenHashes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                    pattern: '^[a-f0-9]{64}$'
                disabled:
                  type: boolean
                  default: false
                linking:
                  type: object
                  required: [provider, tenantClaim, tenantValue, subjectClaim]
                  properties:
                    provider:
                      type: string
                    tenantClaim:
                      type: string
                    tenantValue:
                      type: string
                    subjectClaim:
                      type: string
            status:
              type: object
              properties:
                userCount:
                  type: integer
                groupCount:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', 'Unknown']
                      reason:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Group
          type: string
          jsonPath: .spec.group.name
        - name: Mode
          type: string
          jsonPath: .spec.grantMode
        - name: Disabled
          type: boolean
          jsonPath: .spec.disabled
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
  conversion:
    strategy: None
---
apiVersion: apiextensions.k8s.io/v1
