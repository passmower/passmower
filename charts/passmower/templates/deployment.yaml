{{- if hasKey .Values.passmower "emailEnabled" }}
{{- fail "passmower.emailEnabled was renamed to passmower.outboundEmailEnabled (it governs outbound delivery only; email collection and downstream claims are unaffected)" }}
{{- end }}
{{- if and .Values.passmower.outboundEmailEnabled (not .Values.passmower.emailCredentialsSecretRef) }}
{{- fail "passmower.emailCredentialsSecretRef is required when passmower.outboundEmailEnabled is true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "passmower.fullname" . }}
  labels:
    {{- include "passmower.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "passmower.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "passmower.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "passmower.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: ISSUER_URL
              value: {{ include "passmower.url" . }}
            - name: DEPLOYMENT_NAME
              value: {{ .Chart.Name }}
            {{- /* Per-Pod identity for the operator lease. DEPLOYMENT_NAME is
                   the same string in every replica, so it cannot answer "which
                   of us reconciles" (#236). */}}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_ENABLED
              value: {{ .Values.passmower.leaderElection.enabled | quote }}
            {{- /* Optional string settings: only emit when set & non-empty so a
                   commented-out/empty value falls back to the app default
                   instead of being forced to "" (#67). Booleans are always
                   emitted because `false` is meaningful. */}}
            {{- with .Values.passmower.welcomeMessage }}
            - name: WELCOME_MESSAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passmower.welcomeSubtitle }}
            - name: WELCOME_SUBTITLE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passmower.groupPrefix }}
            - name: GROUP_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passmower.adminGroup }}
            - name: ADMIN_GROUP
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passmower.requiredGroup }}
            - name: REQUIRED_GROUP
              value: {{ . | quote }}
            {{- end }}
            - name: PRIVILEGE_DIRECTORY_GROUPS
              value: {{ .Values.passmower.privilegeDirectoryGroups | default list | toJson | quote }}
            {{- with .Values.passmower.githubOrganization }}
            - name: GITHUB_ORGANIZATION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passmower.usernameSource }}
            - name: USERNAME_SOURCE
              value: {{ . | quote }}
            {{- end }}
            - name: ENROLL_USERS
              value: {{ .Values.passmower.enrollUsers | quote }}
            - name: DISABLE_FRONTEND_EDIT
              value: {{ .Values.passmower.disableFrontendEdit | quote }}
            - name: INGRESS_DISCOVERY_ENABLED
              value: {{ .Values.passmower.ingressDiscovery.enabled | quote }}
            {{- with .Values.passmower.namespaceSelector }}
            - name: NAMESPACE_SELECTOR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passmower.preferredEmailDomain }}
            - name: PREFERRED_EMAIL_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passmower.extraClaimsWebhookUrl }}
            - name: EXTRA_CLAIMS_WEBHOOK_URL
              value: {{ . | quote }}
            {{- end }}
            - name: NORMALIZE_EMAIL_ADDRESSES
              value: {{ .Values.passmower.normalizeEmailAddresses | quote }}
            - name: SITE_SESSION_IP_BINDING
              value: {{ .Values.passmower.siteSessionIpBinding | quote }}
            - name: WEBAUTHN_ENABLED
              value: {{ .Values.passmower.webauthnEnabled | quote }}
            - name: GITHUB_ENABLED
              value: {{ .Values.passmower.githubEnabled | quote }}
            - name: OUTBOUND_EMAIL_ENABLED
              value: {{ .Values.passmower.outboundEmailEnabled | quote }}
            - name: PASSMOWER_VERIFIED_EMAIL_OVERRIDE
              value: {{ .Values.passmower.passmowerVerifiedEmailOverride | quote }}
            - name: AUDIT_ENABLED
              value: {{ .Values.passmower.audit.enabled | quote }}
            - name: AUDIT_INCLUDE_SOURCE_ADDRESS
              value: {{ .Values.passmower.audit.includeSourceAddress | quote }}
            - name: AUDIT_INCLUDE_USER_AGENT
              value: {{ .Values.passmower.audit.includeUserAgent | quote }}
            - name: ACTIVITY_TRACKING_ENABLED
              value: {{ .Values.passmower.activityTracking.enabled | quote }}
            - name: ACTIVITY_FLUSH_INTERVAL_SECONDS
              value: {{ .Values.passmower.activityTracking.flushIntervalSeconds | quote }}
            - name: ACTIVITY_RECENT_APPLICATION_LIMIT
              value: {{ .Values.passmower.activityTracking.recentApplicationLimit | quote }}
            - name: CLIENT_INACTIVE_AFTER_DAYS
              value: {{ .Values.passmower.activityTracking.inactiveAfterDays | quote }}
            - name: INCIDENTS_ENABLED
              value: {{ .Values.passmower.incidents.enabled | quote }}
            - name: INCIDENT_TTL_SECONDS
              value: {{ .Values.passmower.incidents.ttlSeconds | quote }}
            - name: NOTIFY_ON_LOGIN
              value: {{ .Values.passmower.notifications.onLogin | quote }}
            - name: NOTIFY_ON_IMPERSONATION
              value: {{ .Values.passmower.notifications.onImpersonation | quote }}
            - name: GROUP_REQUESTS_ENABLED
              value: {{ .Values.passmower.groupRequests.enabled | quote }}
            - name: GROUP_REQUESTS_REQUIRE_EXISTING_GROUP
              value: {{ .Values.passmower.groupRequests.requireExistingGroup | quote }}
            - name: METRICS_GROUP_MEMBERSHIP
              value: {{ .Values.passmower.metrics.groupMembershipCounts | quote }}
            {{- /* No `default` here: it treats an explicit 0 as empty, and 0 is
                   how the sweep is turned off. Unset renders "", which the app
                   reads as "use the built-in interval". */}}
            - name: RECONCILE_INTERVAL_MS
              value: {{ .Values.passmower.reconcileIntervalMs | quote }}
            - name: OIDC_PROVIDERS
              value: {{ .Values.passmower.oidcProviders | default dict | toJson | quote }}
            - name: REDIS_IP_FAMILY
              value: {{ .Values.redis.ipFamily | default "0" | quote }}
            {{- if .Values.redis.internal.enabled }}
            - name: REDIS_URI
              value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local
            {{- else if .Values.redis.redisClaim.enabled }}
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: redis-{{ include "passmower.fullname" . }}-owner-secrets
                  key: REDIS_MASTER_0_URI
            {{- else if and .Values.redis.external.enabled .Values.redis.external.secretKeyRef.name (not .Values.redis.external.host) (not .Values.redis.external.envFromSecretRef) }}
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.secretKeyRef.name }}
                  key: {{ .Values.redis.external.secretKeyRef.key }}
            {{- end }}
            {{- if .Values.redis.external.enabled }}
            {{- with .Values.redis.external.host }}
            - name: REDIS_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.redis.external.port }}
            - name: REDIS_PORT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.redis.external.usernameSecretKeyRef.name }}
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.usernameSecretKeyRef.name }}
                  key: {{ .Values.redis.external.usernameSecretKeyRef.key }}
            {{- else }}
            {{- with .Values.redis.external.username }}
            - name: REDIS_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.redis.external.database }}
            - name: REDIS_DB
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.redis.external.passwordSecretKeyRef.name }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.passwordSecretKeyRef.name }}
                  key: {{ .Values.redis.external.passwordSecretKeyRef.key }}
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: oidc-keys
            {{- if and .Values.passmower.outboundEmailEnabled .Values.passmower.emailCredentialsSecretRef }}
            - secretRef:
                name: {{ .Values.passmower.emailCredentialsSecretRef }}
            {{- end }}
            {{- if .Values.passmower.githubClientSecretRef }}
            - secretRef:
                name: {{ .Values.passmower.githubClientSecretRef }}
            {{- end }}
            {{- /* Secret with EXTRA_CLAIMS_WEBHOOK_TOKEN for the enrichment webhook. */}}
            {{- if .Values.passmower.extraClaimsWebhookTokenSecretRef }}
            - secretRef:
                name: {{ .Values.passmower.extraClaimsWebhookTokenSecretRef }}
            {{- end }}
            {{- if and .Values.redis.external.enabled .Values.redis.external.envFromSecretRef }}
            - secretRef:
                name: {{ .Values.redis.external.envFromSecretRef }}
            {{- end }}
            {{- /* One secretRef per distinct OIDC provider credentials secret. */}}
            {{- $seen := dict }}
            {{- range .Values.passmower.oidcProviders }}
            {{- if and .clientSecretRef (not (hasKey $seen .clientSecretRef)) }}
            {{- $_ := set $seen .clientSecretRef true }}
            - secretRef:
                name: {{ .clientSecretRef }}
            {{- end }}
            {{- end }}
            {{- if .Values.passmower.slackClientSecretRef }}
            - secretRef:
                name: {{ .Values.passmower.slackClientSecretRef }}
            {{- end }}
          {{- /*
            Readiness gates traffic on the session store and the Kubernetes API;
            liveness only asks whether the process still answers. A Redis outage
            must not restart pods — restarting cannot fix it, and every replica
            probes the same Redis, so a liveness dependency check restarts the
            whole Deployment at once (#265). Neither path reaches oidc-provider,
            so neither needs the x-forwarded-* headers that suppress its warning.
            Both blocks come from values verbatim; null drops the probe.
          */}}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /app/tos
              name: tos
            - mountPath: /app/approval
              name: approval
            - mountPath: /app/disable_frontend_edit
              name: disable-frontend-edit
            - mountPath: /app/src/views/custom/emails
              name: email-templates
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tos
          configMap:
            {{- if .Values.passmower.texts.termsOfService.configMapRef }}
            name: {{ .Values.passmower.texts.termsOfService.configMapRef.name }}
            {{- else }}
            name: {{ include "passmower.fullname" . }}-tos
            {{- end }}
        - name: approval
          configMap:
            {{- if .Values.passmower.texts.approval.configMapRef }}
            name: {{ .Values.passmower.texts.approval.configMapRef.name }}
            {{- else }}
            name: {{ include "passmower.fullname" . }}-approval
            {{- end }}
        - name: disable-frontend-edit
          configMap:
            {{- if .Values.passmower.texts.disableFrontendEdit.configMapRef }}
            name: {{ .Values.passmower.texts.disableFrontendEdit.configMapRef.name }}
            {{- else }}
            name: {{ include "passmower.fullname" . }}-disable-frontend-edit
            {{- end }}
        - name: email-templates
          configMap:
            {{- if .Values.passmower.texts.emails.configMapRef }}
            name: {{ .Values.passmower.texts.emails.configMapRef.name }}
            {{- else }}
            name: {{ include "passmower.fullname" . }}-email-templates
            {{- end }}
