{{- if .Values.redis.redisClaim.enabled }}
apiVersion: codemowers.cloud/v1beta1
kind: RedisClaim
metadata:
  name: {{ include "passmower.fullname" . }}
  labels:
    {{- include "passmower.labels" . | nindent 4 }}
spec: {{ toYaml .Values.redis.redisClaim.spec | nindent 2 }}
{{- end }}
---
{{- if .Values.redis.internal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- merge (dict "app" "redis") (deepCopy .Values.commonLabels) | toYaml | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: redis
  replicas: 1
  template:
    metadata:
      labels:
        {{- merge (dict "app" "redis") (deepCopy .Values.commonLabels) | toYaml | nindent 8 }}
    spec:
      {{- with .Values.redis.internal.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.redis.internal.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.redis.internal.image | default "valkey/valkey:8-alpine" }}
          command:
            - redis-server
          workingDir: /data
          {{- with .Values.redis.internal.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MASTER
              value: "true"
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.internal.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
      {{- with .Values.redis.internal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.internal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.internal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
{{- end }}
